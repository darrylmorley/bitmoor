<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitmoor Ltd - Software Development</title>
  <meta name="description" content="Bitmoor Ltd is a software development company registered in England and Wales. Company number 17133695.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-text: #f0f0f0;
      --color-text-muted: #9ca3af;
      --color-bg: #0a0a0a;
      --color-surface: #141414;
      --color-border: #252525;
      --color-accent: #3b82f6;
      --color-accent-glow: rgba(59, 130, 246, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    header {
      padding: 40px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      height: 36px;
      width: auto;
      filter: brightness(0) invert(1) opacity(0.9);
    }

    .header-link {
      font-size: 14px;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .header-link:hover {
      color: var(--color-accent);
    }

    .hero {
      padding: 64px 0;
      display: flex;
      justify-content: center;
    }

    .hero img {
      width: 280px;
      height: auto;
      filter: brightness(0) invert(1) opacity(0.9);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding-bottom: 64px;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #333;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      margin-bottom: 12px;
    }

    .card p {
      font-size: 15px;
      color: var(--color-text);
      line-height: 1.6;
    }

    .card a {
      color: var(--color-text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .card a:hover {
      color: var(--color-accent);
    }

    .card-full {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--color-surface) 0%, rgba(59, 130, 246, 0.05) 100%);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    footer {
      margin-top: auto;
      padding: 24px 0 32px;
      border-top: 1px solid var(--color-border);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer p {
      font-size: 12px;
      color: #555;
    }

    footer a {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--color-text-muted);
    }

    @media (max-width: 540px) {
      .hero h1 {
        font-size: 36px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card-full {
        grid-column: auto;
      }

      .footer-inner {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="container">
        <div class="header-inner">
          <div class="logo"><img src="logo.png" alt="Bitmoor"></div>
          <a href="mailto:hello@bitmoor.co.uk" class="header-link">hello@bitmoor.co.uk</a>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="hero">
          <img src="logo.png" alt="Bitmoor Ltd - Software Development">
        </div>

        <div class="cards">
          <div class="card">
            <div class="card-label">Contact</div>
            <p><a href="mailto:hello@bitmoor.co.uk">hello@bitmoor.co.uk</a></p>
          </div>

          <div class="card">
            <div class="card-label">Director</div>
            <p>Darryl Morley</p>
          </div>

          <div class="card card-full">
            <div class="card-label">Company</div>
            <p>
              Bitmoor Ltd &middot; Registered in England and Wales &middot;
              <a href="https://find-and-update.company-information.service.gov.uk/company/17133695" target="_blank" rel="noopener">Company number 17133695</a>
            </p>
            <div class="status">
              <span class="status-dot"></span>
              Active
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer-inner">
          <p>&copy; 2025 Bitmoor Ltd</p>
          <a href="https://find-and-update.company-information.service.gov.uk/company/17133695" target="_blank" rel="noopener">Companies House</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
